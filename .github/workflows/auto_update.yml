name: Auto Update Terabox M3U

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # গিটহাবে ফাইল রাইট বা কমিট করার পারমিশন দেওয়ার জন্য এটি জরুরি
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # ভার্সন আপডেট করা হলো

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Auto Generator Script
        env:
          NDUS_COOKIE: ${{ secrets.NDUS_COOKIE }}
        run: python auto_m3u.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Auto update playlist"
          git push
